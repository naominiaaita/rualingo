server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:9090}
spring.application.name=rualingo

# Database Configuration (supports MySQL or PostgreSQL/Supabase via RUALINGO_DB_URL)
# Production deployments must provide RUALINGO_DB_URL.
spring.datasource.url=${RUALINGO_DB_URL:jdbc:mysql://localhost:3306/rualingo_db?createDatabaseIfNotExist=true}
spring.datasource.username=${RUALINGO_DB_USERNAME:root}
spring.datasource.password=${RUALINGO_DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# Redis Configuration (for Leaderboard)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.example.rualingo=DEBUG

# App Security Settings
app.auth.google.client-id=
app.auth.jwt.secret=${JWT_SECRET:9X7pK2xL0r3mQ8sYdJ2pM1nA5uT6wV8c}
app.auth.jwt.expiration-ms=86400000

# OpenAI (optional). Enable by setting OPENAI_ENABLED=true and OPENAI_API_KEY in env.
openai.enabled=${OPENAI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-5}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:20}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
