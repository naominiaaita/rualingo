server.address=0.0.0.0
server.port=${PORT:8080}
spring.application.name=rualingo

# --- DATABASE CONFIGURATION (Connecting to Railway from Fly.io) ---
# In Fly.io, run: fly secrets set RUALINGO_DB_URL="your_railway_mysql_public_url"
# It should look like: jdbc:mysql://xxx.railway.app:port/railway?user=xxx&password=xxx
spring.datasource.url=${RUALINGO_DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- REDIS CONFIGURATION (Connecting to Railway from Fly.io) ---
# In Fly.io, run: fly secrets set REDIS_URL="your_railway_redis_public_url"
spring.data.redis.url=${REDIS_URL}
management.health.redis.enabled=false

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.example.rualingo=DEBUG

# App Security Settings
# In Fly.io, run: fly secrets set JWT_SECRET="your_long_random_secret_string"
app.auth.jwt.secret=${JWT_SECRET}
app.auth.jwt.expiration-ms=86400000

# OpenAI Settings (Optional)
openai.enabled=${OPENAI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
