server.address=0.0.0.0
server.port=${PORT:8080}
spring.application.name=rualingo

# --- DATABASE CONFIGURATION (Connecting to Railway from Fly.io) ---
# Use separate variables for better compatibility
spring.datasource.url=${RUALINGO_DB_URL}
spring.datasource.username=${RUALINGO_DB_USERNAME}
spring.datasource.password=${RUALINGO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- REDIS CONFIGURATION ---
spring.data.redis.url=${REDIS_URL}
management.health.redis.enabled=false

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.example.rualingo=DEBUG

# App Security Settings
app.auth.jwt.secret=${JWT_SECRET}
app.auth.jwt.expiration-ms=86400000
app.auth.firebase.service-account-json-base64=${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}

# OpenAI Settings (Optional)
openai.enabled=${OPENAI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
