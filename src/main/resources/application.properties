# Production deployments must provide RUALINGO_DB_URL. The local fallback avoids
# nested placeholder resolution, which can be interpreted as a circular reference
# by Spring when the environment variable is missing or misconfigured.
spring.datasource.url=${RUALINGO_DB_URL:jdbc:mysql://localhost:3306/rualingo_db?createDatabaseIfNotExist=true}
spring.datasource.username=${RUALINGO_DB_USERNAME:root}
spring.datasource.password=${RUALINGO_DB_PASSWORD:}
