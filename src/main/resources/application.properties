# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.example.rualingo=DEBUG

# App Security Settings
app.auth.google.client-id=
# Supply JWT_SECRET through the hosting provider or local environment.
# JJWT requires at least 32 random bytes for the HMAC signing key.
app.auth.jwt.secret=${JWT_SECRET}
app.auth.jwt.expiration-ms=86400000

# OpenAI (optional). Enable by setting OPENAI_ENABLED=true and OPENAI_API_KEY in env.
openai.enabled=${OPENAI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-5}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:20}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
