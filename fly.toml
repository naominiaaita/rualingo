# fly.toml app configuration file generated for rualingo on 2026-09-18T22:14:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rualingo'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  checks = [{ grace_period = '1m0s', interval = '15s', method = 'GET', path = '/actuator/health', timeout = '10s' }]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-1x'
